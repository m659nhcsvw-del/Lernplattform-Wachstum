<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAS-Rechner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<style>
/* Layout: Gehäuse mit Tastenfeld links, Bildschirm rechts. Gerät mit einem festen Aussehen, daher nur ein Farbschema für das Gehäuse. */
:root {
  --case: #14181d;
  --case-2: #1b2128;
  --case-line: #2b333c;
  --key: #29313a;
  --key-hi: #343e49;
  --key-ink: #e4e9ee;
  --num: #ebe7dc;
  --num-ink: #171a1e;
  --op: #3b4651;
  --fn: #232a32;
  --amber: #e2a63a;
  --amber-ink: #1d1503;
  --teal: #46b3a4;
  --font-ui: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --font-math: "STIX Two Text", "Latin Modern Roman", "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #0c0f12; font-family: var(--font-ui); color: var(--key-ink); overflow: hidden; }
button { font-family: inherit; }
[hidden] { display: none !important; }

#calc { height: 100%; display: grid; grid-template-columns: minmax(300px, 372px) minmax(0, 1fr); gap: 0;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }

/* ---------- Bildschirm-Themen ---------- */
#calc[data-theme="light"] {
  --screen-bg: #f5f6f2; --screen-2: #ebede7; --ink: #15202b; --dim: #5b6772; --line: #cfd5d0; --accent: #1f5fd0; --accent-ink: #ffffff;
  --err: #b42318; --ok: #0e7a5f; --hi: #fff2cc;
  --plot-grid: #c9d0cb; --plot-grid2: #e4e8e3; --plot-axis: #28333d; --plot-ink: #3a4650;
  --plot-c1: #1f5fd0; --plot-c2: #d9480f; --plot-c3: #0e8a6a;
  --menu-bg: #ffffff; --menu-sel: #dbe7fb;
}
#calc[data-theme="dark"] {
  --screen-bg: #10161c; --screen-2: #161e26; --ink: #e8edf1; --dim: #8e9ba7; --line: #2a3541; --accent: #6aa6ff; --accent-ink: #07111f;
  --err: #ff8a7a; --ok: #5fd1b0; --hi: #2b2a15;
  --plot-grid: #2e3b48; --plot-grid2: #1d2832; --plot-axis: #c4ced6; --plot-ink: #a8b4be;
  --plot-c1: #6aa6ff; --plot-c2: #ff9a62; --plot-c3: #5fd1b0;
  --menu-bg: #1b242d; --menu-sel: #26405f;
}

/* ---------- Tastenfeld ---------- */
#keys { background: linear-gradient(180deg, var(--case-2), var(--case)); border-right: 1px solid #000; padding: 16px 14px 14px; overflow-y: auto; display: flex; align-items: flex-start; justify-content: center; }
.keygrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; width: 100%; max-width: 348px; }
.key { position: relative; height: 41px; border: 0; border-radius: 7px; background: var(--key); color: var(--key-ink); font-size: 14px; font-weight: 500; cursor: pointer;
  box-shadow: 0 2px 0 #0b0d10, inset 0 1px 0 rgba(255, 255, 255, .06); padding: 0 2px; display: flex; align-items: center; justify-content: center; }
.key:hover { background: var(--key-hi); }
.key:active { transform: translateY(1px); box-shadow: 0 1px 0 #0b0d10; }
.key:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.key.num { background: var(--num); color: var(--num-ink); font-size: 17px; font-weight: 600; }
.key.num:hover { background: #fff; }
.key.op { background: var(--op); font-size: 17px; }
.key.fn { background: var(--fn); font-size: 13px; }
.key.var { background: var(--fn); font-family: var(--font-math); font-style: italic; font-size: 18px; }
.key.nav { background: var(--fn); font-size: 11px; color: #9eb0c0; }
.key.sys { background: #1e252c; font-size: 12px; color: #c4cfd9; }
.key.accent { background: var(--teal); color: #05201c; font-weight: 700; font-size: 13px; }
.key.enter { background: var(--amber); color: var(--amber-ink); font-weight: 700; font-size: 13px; }
.key.lit { outline: 2px solid var(--amber); outline-offset: 1px; }
.key.accent.lit { background: #6ed0c2; }
.key .alt { position: absolute; top: 2px; left: 0; right: 0; text-align: center; font-size: 8.5px; line-height: 1; color: var(--amber); letter-spacing: .02em; pointer-events: none; opacity: .9; }
.key.num .alt, .key.op .alt { color: #8a5a00; }
.key:has(.alt) .lab { margin-top: 7px; }
#keys.shifted .key:has(.alt) .alt { color: #fff; font-size: 11px; font-weight: 700; top: 5px; }
#keys.shifted .key:has(.alt) .lab { opacity: .45; margin-top: 11px; font-size: 11px; }
.lab { pointer-events: none; }

/* ---------- Bildschirm ---------- */
#screen { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #07090b; padding: 14px; padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
#frame { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--screen-bg); color: var(--ink); border-radius: 10px; border: 1px solid #000;
  box-shadow: 0 0 0 5px #181d23, 0 0 0 6px #2b333c, 0 18px 40px rgba(0, 0, 0, .5); overflow: hidden; font-size: var(--fs, 14px); position: relative; }
#topbar { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; background: var(--screen-2); border-bottom: 1px solid var(--line); min-height: 38px; flex: none; }
#tabs { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: thin; align-items: stretch; }
.tab { border: 0; background: transparent; color: var(--dim); font: 600 12.5px var(--font-ui); padding: 10px 9px 8px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.tab.sepa { margin-left: 8px; }
.tab.plus { font-size: 16px; padding: 6px 9px; font-weight: 500; }
.mbtns { display: flex; gap: 6px; flex: none; }
.mbtn { border: 1px solid var(--line); background: var(--screen-bg); color: var(--ink); font: 600 12.5px var(--font-ui); padding: 6px 11px; border-radius: 6px; cursor: pointer; }
.mbtn:hover, .mbtn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mbtn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#stage { flex: 1; min-height: 0; position: relative; display: flex; }
#pageArea { flex: 1; min-width: 0; min-height: 0; display: flex; padding: 6px; }
#statusbar { display: flex; gap: 14px; padding: 5px 12px; background: var(--screen-2); border-top: 1px solid var(--line); font: 500 11px var(--font-mono); color: var(--dim); flex: none; align-items: center; }
#statusbar #stMenu { color: var(--accent); font-weight: 600; min-width: 80px; }
#statusbar #stPy { margin-left: auto; font-family: var(--font-ui); }
#statusbar span:not(#stPy):not(#stMenu) { padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; }

/* ---------- Fensterteilung ---------- */
.split { display: flex; flex: 1 1 0; min-width: 0; min-height: 0; }
.split.v { flex-direction: row; }
.split.h { flex-direction: column; }
.split > .pane, .split > .split { min-width: 0; min-height: 0; }
.divider { flex: none; background: var(--line); position: relative; z-index: 2; }
.split.v > .divider { width: 5px; cursor: col-resize; margin: 0 1px; border-radius: 3px; }
.split.h > .divider { height: 5px; cursor: row-resize; margin: 1px 0; border-radius: 3px; }
.divider:hover, .divider.drag { background: var(--accent); }
.divider::after { content: ""; position: absolute; inset: -6px; }
.pane { flex: 1 1 0; display: flex; border: 2px solid transparent; border-radius: 6px; overflow: hidden; background: var(--screen-bg); min-width: 0; min-height: 0; }
.pane.active { border-color: var(--accent); }
.split .pane:only-child { border-color: transparent; }
.app { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

/* ---------- Menü ---------- */
#menuLayer { position: absolute; left: 6px; top: 4px; z-index: 30; width: min(560px, calc(100% - 12px)); max-width: calc(100% - 12px); display: flex; flex-direction: column; gap: 0; pointer-events: none; }
#menuLayer > * { pointer-events: auto; }
#menuLayer.shake { animation: shake .25s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
/* Untermenüs klappen abwechselnd nach rechts und links auf (Ebene 0 links, 1 rechts, 2 links über Ebene 0, 3 rechts …), damit nichts über den Rand ragt */
.menu-cols { position: relative; width: 100%; pointer-events: none; padding-bottom: 2px; }
.menu-col { list-style: none; margin: 0; padding: 4px 0; position: absolute; top: 0; left: 0; width: calc((100% - 2px) / 2); box-sizing: border-box; pointer-events: auto; background: var(--menu-bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(0, 0, 0, .28); max-height: calc(100vh - 150px); overflow-y: auto; flex: none; }
.mrow { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; cursor: pointer; min-height: 32px; }
.mrow:hover { background: var(--screen-2); }
.mrow.sel { background: var(--menu-sel); }
.mrow.pend { background: var(--accent); color: var(--accent-ink); }
.mnum { flex: none; width: 20px; height: 20px; border-radius: 5px; background: var(--screen-2); color: var(--accent); font: 600 11.5px var(--font-mono); display: grid; place-items: center; border: 1px solid var(--line); }
.mrow.pend .mnum { background: #fff; color: #111; }
.mlab { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.25; }
.mchev { color: var(--dim); font-size: 11px; }
.minfo { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--dim); background: transparent; color: var(--dim); font: italic 600 12px var(--font-math); cursor: pointer; padding: 0; line-height: 1; }
.minfo:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.menu-hint { margin-top: 3px; background: var(--menu-bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--dim); max-width: 560px; }
.menu-hint b { color: var(--accent); font-family: var(--font-mono); }

/* ---------- Dialoge ---------- */
#modal { position: absolute; inset: 0; z-index: 40; background: rgba(8, 12, 16, .45); display: flex; align-items: center; justify-content: center; padding: 14px; }
.modal-box { background: var(--menu-bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; width: min(440px, 100%); max-height: 100%; overflow: auto; box-shadow: 0 18px 50px rgba(0, 0, 0, .4); display: flex; flex-direction: column; gap: 10px; }
.modal-box.wide { width: min(760px, 100%); }
.modal-box h3 { margin: 0; font-size: 16px; }
.dlg-field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--dim); }
.dlg-field input, .dlg-field select, .sel { font: 14px var(--font-mono); padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--screen-bg); color: var(--ink); }
.dlg-field small { color: var(--dim); }
.dlg-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.btn { font: 600 13px var(--font-ui); padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--screen-2); color: var(--ink); cursor: pointer; }
.btn:hover { background: var(--menu-sel); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.info-code { margin: 0; padding: 8px 10px; background: var(--screen-2); border: 1px solid var(--line); border-radius: 6px; font: 500 13px var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.info-text { margin: 0; line-height: 1.5; font-size: 14px; }
.info-py, .info-sc { margin: 0; font-size: 12.5px; color: var(--dim); }
.info-py code { font-family: var(--font-mono); color: var(--ink); }
.info-sc b { font-family: var(--font-mono); color: var(--accent); }
#toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 50; background: #11171c; color: #f1f4f6; padding: 8px 14px; border-radius: 8px; font-size: 13px; max-width: 86%; box-shadow: 0 6px 20px rgba(0, 0, 0, .35); }
table.vtab { width: 100%; border-collapse: collapse; font-size: 13px; }
table.vtab th { text-align: left; font-weight: 600; color: var(--dim); font-size: 11.5px; padding: 3px 6px; }
table.vtab td { padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
table.vtab .vn { font: 600 13px var(--font-mono); color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; }
table.vtab .vt { color: var(--dim); font-size: 12px; }
.help-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
.help-grid code { font: 600 12.5px var(--font-mono); color: var(--accent); }

/* ---------- Rechner ---------- */
.calc { background: var(--screen-bg); }
.calc-hist { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.entry { display: flex; flex-direction: column; gap: 1px; padding: 5px 0 6px; border-bottom: 1px dotted var(--line); }
.ein { cursor: pointer; color: var(--dim); font-size: 1.05em; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.ein:hover { color: var(--ink); }
.eout { text-align: right; font-size: 1.2em; cursor: pointer; overflow-x: auto; overflow-y: hidden; padding: 2px 0; color: var(--ink); }
.eout:hover { background: var(--hi); }
.eout .approx { color: var(--dim); font-size: .85em; }
.eout.err { color: var(--err); font-size: 13px; text-align: left; font-family: var(--font-ui); white-space: normal; }
.calc-row { display: flex; align-items: center; gap: 8px; border-top: 2px solid var(--line); padding: 8px 12px; background: var(--screen-2); flex: none; }
.prompt { color: var(--accent); font: 700 18px var(--font-mono); }
.calc-in { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 500 1.15em var(--font-mono); outline: none; padding: 4px 0; }
.calc-in::placeholder { color: var(--dim); opacity: .7; }
.katex { font-size: 1.08em; }
.ein .katex, .eout .katex { white-space: nowrap; }
.tex-fallback { font-family: var(--font-mono); }

/* ---------- Plot-Anwendungen ---------- */
.plot-host { position: relative; flex: 1; min-height: 80px; min-width: 0; background: var(--screen-bg); }
canvas.plot { position: absolute; inset: 0; display: block; touch-action: none; outline: none; cursor: crosshair; }
.g-entries { flex: none; max-height: 36%; overflow-y: auto; border-top: 2px solid var(--line); background: var(--screen-2); padding: 4px 8px; }
.g-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.g-vis { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--c); background: transparent; cursor: pointer; padding: 0; }
.g-vis.on { background: var(--c); }
.g-lab { flex: none; font: italic 14px var(--font-math); color: var(--ink); white-space: nowrap; }
.g-ins { flex: 1; display: flex; gap: 6px; min-width: 0; }
.g-ins input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--screen-bg); color: var(--ink); font: 500 13.5px var(--font-mono); padding: 5px 8px; border-radius: 5px; }
.g-ins input:focus, .calc-in:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.g-del { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 0; background: transparent; color: var(--dim); font-size: 17px; cursor: pointer; line-height: 1; padding: 0; }
.g-del:hover { background: var(--err); color: #fff; }
.g-empty { margin: 4px 0; color: var(--dim); font-size: 12.5px; }
.g-res { flex: none; max-height: 28%; overflow-y: auto; padding: 5px 10px; background: var(--screen-2); border-top: 1px solid var(--line); font-size: 12.5px; }
.g-rrow { padding: 2px 0; }
.g-rrow .dim, .dim { color: var(--dim); font-size: 11.5px; margin: 0 6px; }
.g-sliders { flex: none; padding: 0 10px; background: var(--screen-2); }
.g-slider { display: grid; grid-template-columns: 18px 1fr 56px 22px; gap: 8px; align-items: center; padding: 3px 0; }
.g-slider i { font: italic 15px var(--font-math); }
.g-slider output { font: 600 12px var(--font-mono); text-align: right; }
.g-slider input[type=range] { accent-color: var(--accent); width: 100%; }
.geo-bar { flex: none; padding: 5px 10px; font-size: 12px; color: var(--dim); background: var(--screen-2); border-bottom: 1px solid var(--line); }
.geo-meas { flex: none; display: flex; gap: 14px; flex-wrap: wrap; padding: 5px 10px; background: var(--screen-2); border-top: 1px solid var(--line); font: 600 12.5px var(--font-mono); }
.data-bar { flex: none; display: flex; gap: 12px; align-items: center; padding: 5px 10px; background: var(--screen-2); border-bottom: 1px solid var(--line); font-size: 12.5px; flex-wrap: wrap; }
.data-bar .sel { padding: 3px 6px; font-size: 12.5px; }
.data-info { color: var(--dim); }
.data-info .katex { color: var(--ink); }

/* ---------- Listen, Notizen ---------- */
.lt-wrap { flex: 1; min-height: 0; overflow: auto; }
table.lt { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
table.lt th, table.lt td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; background: var(--screen-bg); }
table.lt th.corner, table.lt th.rown { width: 34px; min-width: 34px; background: var(--screen-2); color: var(--dim); font: 500 11px var(--font-mono); text-align: center; position: sticky; left: 0; z-index: 1; }
table.lt tr.lt-name th, table.lt tr.lt-formula th { position: sticky; top: 0; z-index: 2; background: var(--screen-2); }
table.lt tr.lt-formula th { top: 29px; }
table.lt th.corner { z-index: 3; }
table.lt input { width: 100%; min-width: 96px; border: 0; background: transparent; color: var(--ink); font: 500 13px var(--font-mono); padding: 6px 8px; outline: none; }
table.lt input.hname { font-weight: 700; color: var(--accent); }
table.lt input.hform { font-size: 12px; color: var(--dim); font-style: italic; padding: 3px 8px; }
table.lt input.cell:focus, table.lt input.hform:focus, table.lt input.hname:focus { background: var(--hi); box-shadow: inset 0 0 0 2px var(--accent); }
.lt-out { flex: none; border-top: 2px solid var(--line); background: var(--screen-2); padding: 8px 12px; max-height: 45%; overflow: auto; }
.lt-out h4 { margin: 0 0 6px; font-size: 13px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, auto 1fr); gap: 4px 12px; align-items: center; margin-bottom: 8px; }
.stat-res { overflow-x: auto; margin-bottom: 6px; }
.err { color: var(--err); }
.notes { padding: 0; }
.notes-ed { flex: 1; overflow: auto; padding: 14px 18px; outline: none; font-size: 1.05em; line-height: 1.55; }
.notes-ed h4 { margin: .2em 0 .4em; font-size: 1.25em; }
.notes-ed p { margin: .3em 0; }
.mathbox { display: inline-block; padding: 1px 8px; background: var(--screen-2); border: 1px solid var(--line); border-radius: 6px; }

@media (max-width: 860px) {
  #calc { grid-template-columns: 1fr; grid-template-rows: minmax(60%, 1fr) auto; }
  #screen { order: 1; }
  #keys { order: 2; border-right: 0; border-top: 1px solid #000; }
  body { overflow: auto; }
  html, body { height: auto; min-height: 100%; }
  #calc { height: 100vh; min-height: 640px; }
}
@media (prefers-reduced-motion: reduce) { #menuLayer.shake { animation: none; } }

.entry { position: relative; }
.edel { position: absolute; top: 3px; right: 0; width: 20px; height: 20px; border: 0; border-radius: 50%; background: var(--screen-2); color: var(--dim); font-size: 15px; line-height: 1; cursor: pointer; opacity: 0; padding: 0; }
.entry:hover .edel, .edel:focus-visible { opacity: 1; }
@media (pointer: coarse) { .edel { opacity: .8; } }
.edel:hover { background: var(--err); color: #fff; }
.menu-title { align-self: flex-start; margin-bottom: 3px; padding: 3px 10px; border-radius: 6px; font: 700 11.5px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); }
#menuLayer.k-doc .menu-title { background: var(--amber); color: var(--amber-ink); }
#menuLayer.k-doc .menu-col { border-color: var(--amber); }
#menuLayer.k-doc .mnum { color: #9a6a00; }
#calc[data-theme="dark"] #menuLayer.k-doc .mnum { color: var(--amber); }
.menu-hint { align-self: flex-start; }

.key.catkey { font-size: 11px; color: var(--amber); }
.modal-box.huge { width: min(1040px, 100%); height: min(100%, 800px); }
.cat-top { display: flex; align-items: center; gap: 12px; }
.cat-top h3 { flex: none; }
.cat-count { flex: 1; color: var(--dim); font-size: 12.5px; }

<script type="text/plain" id="corepy">
# -*- coding: utf-8 -*-
# Rechenkern des Nspire-Rechners: SymPy / NumPy / SciPy, laeuft in Pyodide oder nativ.
import re, ast, json, math, itertools, random
import sympy as sp
from sympy import (Symbol, Integer, Rational, Float, Matrix, Eq, Ne, And, Or, Not, Lambda,
                   Function, S, I, E, pi, oo, Abs, Piecewise, FiniteSet, Interval, Union)
from sympy.parsing.sympy_parser import (stringify_expr, standard_transformations, convert_xor,
                                        implicit_multiplication, implicit_application, function_exponentiation)

TRANS = standard_transformations + (convert_xor, implicit_multiplication, implicit_application, function_exponentiation)
CFG = {"angle": "rad", "mode": "auto", "digits": 10}
PROBLEMS = {}      # problem-id -> {"ns": {...}, "src": {name: text}}
CUR = None         # aktuelles Problem
LAST = {"ans": None}


GREEK = {"alpha", "beta", "gamma", "delta", "epsilon", "zeta", "eta", "theta", "iota", "kappa", "mu", "nu", "xi", "rho", "sigma", "tau", "phi", "chi", "psi", "omega", "lambda", "Gamma", "Delta", "Theta", "Lambda", "Xi", "Pi", "Sigma", "Phi", "Psi", "Omega"}


class SList(list):
    """Liste mit elementweiser Arithmetik (wie beim TI)."""
    def _op(self, o, f):
        if isinstance(o, (list, tuple)):
            if len(o) != len(self):
                raise Fehler("Listen müssen gleich lang sein")
            return SList(f(a, b) for a, b in zip(self, o))
        return SList(f(a, o) for a in self)

    def _rop(self, o, f):
        return SList(f(o, a) for a in self)
    __add__ = lambda s, o: s._op(o, lambda a, b: a + b)
    __radd__ = lambda s, o: s._rop(o, lambda a, b: a + b)
    __sub__ = lambda s, o: s._op(o, lambda a, b: a - b)
    __rsub__ = lambda s, o: s._rop(o, lambda a, b: a - b)
    __mul__ = lambda s, o: s._op(o, lambda a, b: a * b)
    __rmul__ = lambda s, o: s._rop(o, lambda a, b: a * b)
    __truediv__ = lambda s, o: s._op(o, lambda a, b: a / b)
    __rtruediv__ = lambda s, o: s._rop(o, lambda a, b: a / b)
    __pow__ = lambda s, o: s._op(o, lambda a, b: a ** b)
    __rpow__ = lambda s, o: s._rop(o, lambda a, b: a ** b)
    __neg__ = lambda s: SList(-a for a in s)


class Fehler(Exception):
    pass


def _scipy():
    import scipy.stats as st
    return st


# ---------------------------------------------------------------- Hilfsfunktionen
def _isl(a):
    return isinstance(a, (list, tuple))


def _num(a):
    return sp.nsimplify(a) if isinstance(a, float) else sp.sympify(a)


def _vals(a):
    if isinstance(a, sp.MatrixBase):
        return list(a)
    if _isl(a):
        return list(a)
    return [a]


def _fl(a):
    return float(sp.N(a))


def _var(expr, x=None):
    if x is not None:
        return x
    fs = sorted(sp.sympify(expr).free_symbols, key=lambda s: s.name)
    if not fs:
        return Symbol("x")
    return Symbol("x") if Symbol("x") in fs else fs[0]


def _deg(a):
    return a * pi / 180 if CFG["angle"] == "deg" else a


def _undeg(a):
    return a * 180 / pi if CFG["angle"] == "deg" else a


def _tf(f):
    return lambda a: f(_deg(a))


def _itf(f):
    return lambda a: _undeg(f(a))


def f_log(x, b=None):
    if b is None:
        return sp.log(x, 10)
    return sp.log(x, b)


def f_root(x, n=2):
    n = sp.sympify(n)
    x = sp.sympify(x)
    if x.is_number and x.is_real and n.is_Integer and n % 2 == 1:
        return sp.real_root(x, n)
    return x ** (1 / n)


def f_round(x, n=0):
    if int(n) != 0:
        return sp.Float(sp.N(x, 30)).round(int(n))
    v = sp.N(x, 30)
    return sp.Integer(int(sp.sign(v) * sp.floor(abs(v) + sp.Rational(1, 2))))


def f_N(x, n=None):
    return sp.N(x, int(n) if n is not None else CFG["digits"])


def f_nsimplify(x, tol=None):
    return sp.nsimplify(x, rational=True) if tol is None else sp.nsimplify(x, tolerance=tol, rational=True)


def f_subs(e, x, v=None):
    if v is None and isinstance(x, Eq):
        return e.subs(x.lhs, x.rhs)
    if isinstance(x, (list, tuple)):
        return e.subs(list(zip(x, v)))
    return sp.sympify(e).subs(x, v)


class Loesung:
    """Ergebnis von solve: wird als x = a oder x = b gesetzt."""
    def __init__(self, var, menge):
        self.var, self.menge = var, menge


def _set_tex(var, m, L):
    v = L(var)
    if m is S.EmptySet:
        return r"\text{keine Lösung}"
    if m is S.Reals:
        return v + r"\in\mathbb{R}"
    if m is S.Complexes:
        return v + r"\in\mathbb{C}"
    if isinstance(m, FiniteSet):
        return r"\text{ oder }".join(f"{v}={L(e)}" for e in m) if len(m) else r"\text{keine Lösung}"
    if isinstance(m, Interval):
        a, b = m.start, m.end
        lo = r"\le" if not m.left_open else "<"
        hi = r"\le" if not m.right_open else "<"
        if a == -oo and b == oo:
            return v + r"\in\mathbb{R}"
        if a == -oo:
            return f"{v}{hi}{L(b)}"
        if b == oo:
            ge = ">" if m.left_open else r"\ge"
            return f"{v}{ge}{L(a)}"
        return f"{L(a)}{lo}{v}{hi}{L(b)}"
    if isinstance(m, Union):
        return r"\text{ oder }".join(_set_tex(var, a, L) for a in m.args)
    if isinstance(m, sp.Complement):
        return v + r"\in " + L(m)
    return L(m)


def _solve_vars(eqs, x):
    if x is None:
        fs = set()
        for e in (eqs if _isl(eqs) else [eqs]):
            fs |= sp.sympify(e).free_symbols
        fs = sorted(fs, key=lambda s: s.name)
        return Symbol("x") if Symbol("x") in fs or not fs else fs[0]
    return x


def _eqlist(a):
    if isinstance(a, And):
        out = []
        for t in a.args:
            out += _eqlist(t)
        return out
    if isinstance(a, sp.MatrixBase) or _isl(a):
        out = []
        for t in list(a):
            out += _eqlist(t)
        return out
    return [a]


def _clean(m):
    if isinstance(m, sp.Intersection):
        for a in m.args:
            if isinstance(a, FiniteSet):
                return a
    return m


def _solve_one(rel, x, dom):
    """Lösungsmenge einer Aussage in einer Variablen (auch und/oder)."""
    if isinstance(rel, And):
        m = dom
        for t in rel.args:
            m = m.intersect(_solve_one(t, x, dom))
        return m
    if isinstance(rel, Or):
        m = S.EmptySet
        for t in rel.args:
            m = m.union(_solve_one(t, x, dom))
        return m
    return _clean(sp.solveset(rel, x, dom))


def _gather_syms(items):
    fs = set()
    for e in items:
        fs |= (e.lhs - e.rhs).free_symbols if isinstance(e, Eq) else sp.sympify(e).free_symbols
    return sorted(fs, key=lambda s: s.name)


def _solve_any(eq, x, rest, dom):
    xs = None if x is None else (_vals(x) + list(rest))
    items = _eqlist(eq) if not isinstance(eq, Or) else [eq]
    if isinstance(eq, Or) or isinstance(eq, And) and False:
        v = xs[0] if xs else _solve_vars(eq, None) if False else (xs[0] if xs else _gather_syms([eq])[0])
        return Loesung(v, _solve_one(eq, v, dom))
    allEq = all(isinstance(e, Eq) for e in items)
    syms = xs if xs else _gather_syms(items)
    if len(items) == 1 and not isinstance(items[0], Or) and (xs is None or len(xs) == 1):
        v = syms[0] if syms else Symbol("x")
        return Loesung(v, _solve_one(items[0], v, dom)) if not (len(syms) > 1 and xs is None and False) else None
    if allEq and len(syms) >= 2:
        sol = sp.solve(items, syms, dict=True)
        if not sol:
            return Report([("", r"\text{keine Lösung}")])
        rows = [("", r"\ \text{ und }\ ".join(f"{_latex(k)}={_latex(v)}" for k, v in d.items())) for d in sol]
        return Report(rows, join=r"\text{ oder }")
    v = syms[0] if syms else Symbol("x")
    if len(syms) > 1:
        raise Fehler("Mehrere Unbekannte nur bei Gleichungen. Variable angeben, z. B. solve(… ; x)")
    return Loesung(v, _solve_one(And(*items) if len(items) > 1 else items[0], v, dom))


def f_solve(eq, x=None, *rest):
    return _solve_any(eq, x, rest, S.Reals)


def f_csolve(eq, x=None, *rest):
    return _solve_any(eq, x, rest, S.Complexes)


def f_zeros(e, x=None):
    if isinstance(e, (int, sp.Integer)) and x is not None and not isinstance(x, Symbol):
        return sp.zeros(int(e), int(x))
    return f_solve(sp.Eq(e, 0), x)


def f_nsolve(e, x=None, x0=1):
    x = _var(e, x)
    if isinstance(e, Eq):
        e = e.lhs - e.rhs
    return sp.nsolve(e, x, x0)


def f_fsolve(e, x=None, x0=1):
    import numpy as np
    from scipy.optimize import fsolve
    x = _var(e, x)
    if isinstance(e, Eq):
        e = e.lhs - e.rhs
    fn = sp.lambdify(x, e, "numpy")
    return Float(float(fsolve(fn, float(x0))[0]), CFG["digits"])


def f_brentq(e, x, a, b):
    from scipy.optimize import brentq
    if isinstance(e, Eq):
        e = e.lhs - e.rhs
    fn = sp.lambdify(x, e, "numpy")
    return Float(brentq(fn, _fl(a), _fl(b)), CFG["digits"])


def f_nroots(e, x=None):
    x = _var(e, x)
    return sp.Poly(e, x).nroots(n=CFG["digits"])


def f_quad(e, x, a, b):
    from scipy.integrate import quad
    fn = sp.lambdify(x, e, "numpy")
    v, err = quad(fn, _fl(a), _fl(b))
    return Float(v, CFG["digits"])


def f_minimize(e, x, x0=0):
    from scipy.optimize import minimize
    fn = sp.lambdify(x, e, "numpy")
    r = minimize(lambda v: fn(v[0]), [float(x0)])
    return Report([("x_{min}", _latex(Float(float(r.x[0]), CFG["digits"]))), ("f(x_{min})", _latex(Float(float(r.fun), CFG["digits"])))])


def f_maximize(e, x, x0=0):
    from scipy.optimize import minimize
    fn = sp.lambdify(x, e, "numpy")
    r = minimize(lambda v: -fn(v[0]), [float(x0)])
    return Report([("x_{max}", _latex(Float(float(r.x[0]), CFG["digits"]))), ("f(x_{max})", _latex(Float(float(-r.fun), CFG["digits"])))])


def f_ndiff(e, x, a):
    return sp.N(sp.diff(e, x).subs(x, a), CFG["digits"])


def f_diff(e, *a):
    if not a:
        return sp.diff(e, _var(e))
    return sp.diff(e, *a)


def f_integrate(e, x=None, a=None, b=None):
    x = _var(e, x)
    if a is None:
        return sp.integrate(e, x)
    return sp.integrate(e, (x, a, b))


def f_limit(e, x, a, d=None):
    if d is None:
        return sp.limit(e, x, a)
    return sp.limit(e, x, a, d)


def f_sum(*a):
    if len(a) == 1:
        return sp.Add(*_vals(a[0]))
    return sp.summation(*_sumargs(a))


def f_prod(*a):
    if len(a) == 1:
        return sp.Mul(*_vals(a[0]))
    return sp.product(*_sumargs(a))


def _sumargs(a):
    e, k, lo, hi = a
    return e, (k, lo, hi)


def f_series(e, x=None, a=0, n=6):
    x = _var(e, x)
    return sp.series(e, x, a, int(n) + 1)

def _crit(e, x, k):

    try:
        sol = sp.solveset(d, x, S.Reals)
        return sorted(list(sol), key=lambda v: float(sp.N(v))) if isinstance(sol, FiniteSet) else []
    except Exception:
        return []


def f_extrema(e, x=None):
    x = _var(e, x)
    rows = []
    for c in _crit(e, x, 1):
        s = sp.diff(e, x, 2).subs(x, c)
        if s.is_positive:
            t = "Tiefpunkt"
        elif s.is_negative:
            t = "Hochpunkt"
        else:
            t = "Sattelpunkt" if sp.diff(e, x, 3).subs(x, c) != 0 else "unbestimmt"
        rows.append((r"\text{" + t + "}", f"({_latex(c)}\\,|\\,{_latex(sp.simplify(e.subs(x, c)))})"))
    return Report(rows or [("", r"\text{keine Extrema}")])


def f_wendepunkte(e, x=None):
    x = _var(e, x)
    rows = []
    for c in _crit(e, x, 2):
        if sp.diff(e, x, 3).subs(x, c) != 0:
            rows.append((r"\text{Wendepunkt}", f"({_latex(c)}\\,|\\,{_latex(sp.simplify(e.subs(x, c)))})"))
    return Report(rows or [("", r"\text{keine Wendepunkte}")])


def f_kurvendisk(e, x=None):
    x = _var(e, x)
    L = _latex
    rows = [("f(x)", L(e)), ("f'(x)", L(sp.diff(e, x))), ("f''(x)", L(sp.diff(e, x, 2)))]
    z = _crit_zero(e, x)
    rows.append((r"\text{Nullstellen}", z))
    rows.append((r"y\text{-Achsenabschnitt}", L(sp.simplify(e.subs(x, 0)))))
    for lab, rep in (("", f_extrema(e, x)), ("", f_wendepunkte(e, x))):
        for l2, v in rep.rows:
            rows.append((l2, v))
    try:
        rows.append((r"x\to\infty", L(sp.limit(e, x, oo))))
        rows.append((r"x\to-\infty", L(sp.limit(e, x, -oo))))
    except Exception:
        pass
    return Report(rows)


def _crit_zero(e, x):
    try:
        m = sp.solveset(e, x, S.Reals)
        if isinstance(m, FiniteSet):
            return r",\ ".join(_latex(v) for v in sorted(m, key=lambda v: float(sp.N(v)))) or r"\text{keine}"

def _store(**kw):
    if CUR is not None:
        for k, v in kw.items():
            CUR["ns"]["stat_" + k] = v


def _reg(xs, ys, kind, deg=1):
    import numpy as np
    x = Symbol("x")
    X, Y = np.array(_fa(xs)), np.array(_fa(ys))
    F = lambda v: Float(float(v), CFG["digits"])
    names = "abcdef"
    if kind == "poly":
        co = np.polyfit(X, Y, deg)
        expr = sum(F(c) * x ** (deg - i) for i, c in enumerate(co))
        pred = np.polyval(co, X)
        for i, c in enumerate(co):
            _store(**{names[i]: F(c)})
    elif kind == "exp":
        co = np.polyfit(X, np.log(Y), 1)
        a, b = math.exp(co[1]), math.exp(co[0])
        expr = F(a) * F(b) ** x
        pred = a * b ** X
        _store(a=F(a), b=F(b))
    elif kind == "log":
        co = np.polyfit(np.log(X), Y, 1)
        expr = F(co[1]) + F(co[0]) * sp.log(x)
        pred = co[1] + co[0] * np.log(X)
        _store(a=F(co[1]), b=F(co[0]))
    elif kind == "pow":
        co = np.polyfit(np.log(X), np.log(Y), 1)
        a, b = math.exp(co[1]), co[0]
        expr = F(a) * x ** F(b)
        pred = a * X ** b
        _store(a=F(a), b=F(b))
    ss_res = float(((Y - pred) ** 2).sum())
    ss_tot = float(((Y - Y.mean()) ** 2).sum())
    r2 = 1 - ss_res / ss_tot if ss_tot else 1.0
    _store(r2=F(r2), reg=expr)
    L = _latex
    rows = [("y", L(expr)), ("R^2", L(F(r2)))]
    if kind == "poly" and deg == 1:
        rows.append(("r", L(F(np.corrcoef(X, Y)[0, 1]))))
    return Report(rows, expr=expr)

    a, b, c = (e.coeff(v) for v in (x, y, z))
    d = -e.subs({x: 0, y: 0, z: 0})
    P = Matrix(P)
    return sp.simplify(Abs(a * P[0] + b * P[1] + c * P[2] - d) / sp.sqrt(a**2 + b**2 + c**2))


def f_abstandPG(P, A, u):
    P, A, u = Matrix(P), Matrix(A), Matrix(u)
    return sp.simplify((P - A).cross(u).norm() / u.norm())


def f_schnittGE(A, u, E):
    x, y, z, t = sp.symbols("x y z t")
    A, u = Matrix(A), Matrix(u)
    e = E.lhs - E.rhs
    ee = e.subs({x: A[0] + t * u[0], y: A[1] + t * u[1], z: A[2] + t * u[2]})
    s = sp.solve(ee, t)
    if not s:
        return Report([("", r"\text{kein Schnittpunkt}")])
    pt = (A + s[0] * u).applyfunc(sp.simplify)
    return Report([("t", _latex(s[0])), ("S", _latex(pt))])


def f_torad(a):
    return a * pi / 180


def f_todeg(a):
    return a * 180 / pi


def f_lagr(xs, ys):
    return f_lagrange(xs, ys)


class Report:
    """Tabellarische Ausgabe: Liste von (Beschriftung, LaTeX)."""
    def __init__(self, rows, join=None, expr=None):
        self.rows, self.join, self.expr = rows, join, expr

    def tex(self):
        if self.join:
            return self.join.join(r for _, r in self.rows)
        if len(self.rows) == 1 and not self.rows[0][0]:
            return self.rows[0][1]
        body = r"\\".join((f"{a}&={b}" if a else f"&{b}") for a, b in self.rows)
        return r"\begin{aligned}" + body + r"\end{aligned}"

# ---------------------------------------------------------------- Vorverarbeitung
UNI = {"ⅈ": " _I ", "·": "*", "×": "*", "÷": "/", "−": "-", "–": "-", "²": "**2", "³": "**3", "π": "pi", "∞": "oo", "≤": "<=", "≥": ">=",
       "≠": "!=", "′": "'", "√": "sqrt", "ℯ": "e", "θ": "theta", "^": "^"}
ID = re.compile(r"[A-Za-z_Ͱ-Ͽ][A-Za-z0-9_Ͱ-Ͽ]*")



_PAIR = {"(": ")", "[": "]", "{": "}"}


def _logic(s):
    """Wandelt 'a and b', 'a or b' in _and(a, b), _or(a, b) um (je Argument, auch in Klammern)."""
    if not re.search(r"\b(and|or)\b", s):
        return s
    out, i = "", 0
    while i < len(s):
        ch = s[i]
        if ch in _PAIR:
            d, j = 0, i
            while j < len(s):
                if s[j] in _PAIR:
                    d += 1
                elif s[j] in ")]}":
                    d -= 1
                    if d == 0:
                        break
                j += 1
            inner = s[i + 1:j] if j < len(s) else s[i + 1:]
            out += ch + _logic(inner) + (s[j] if j < len(s) else "")
            i = j + 1
        else:
            out += ch
            i += 1
    return ";".join(_split_logic(a) for a in _split_args(out))


def _split_logic(a):
    parts = re.split(r"\s+or\s+", a)
    if len(parts) > 1:
        return "_or(" + ", ".join(_split_logic(p) for p in parts) + ")"
    parts = re.split(r"\s+and\s+", a)
    if len(parts) > 1:
        return "_and(" + ", ".join(p.strip() for p in parts) + ")"
    return a



def _abs_bars(s):
    if "|" not in s:
        return s
    out, stack, prev = [], 0, ""
    for ch in s:
        if ch == "|":
            if stack and prev not in "(,[+-*/^=<>;:|" and prev != "":
                out.append(")")
                stack -= 1
                prev = ")"
            else:
                out.append("Abs(")
                stack += 1
                prev = "("
        else:
            out.append(ch)
            if not ch.isspace():
                prev = ch
    return "".join(out)


def _brackets(s):
    out, st = [], []
    for ch in s:
        if ch == "[":
            if "[" not in st:
                out.append("_M([")
            else:
                out.append("[")
            st.append("[")
        elif ch == "]":
            k = st.pop() if st else "["
            out.append("])" if "[" not in st else "]")
        elif ch == "{":
            out.append("_L([")
            st.append("{")
        elif ch == "}":
            if st:
                st.pop()
            out.append("])")
        else:
            out.append(ch)
    return "".join(out)


def _split_args(s):
    parts, depth, cur = [], 0, ""
    for ch in s:
        if ch in "([{":
            depth += 1
        elif ch in ")]}":
            depth -= 1
        if ch == ";" and depth == 0:
            parts.append(cur)
            cur = ""
        else:
            cur += ch
    parts.append(cur)
    return parts


def _ids(s, known):
    def rep(m):
        t = m.group(0)
        if t == "gamma" and s[m.end():m.end() + 1] == "(":
            return "_gamma"
        if t in known or t in GREEK or t in ("and", "or", "not", "True", "False") or "_" in t or any(c.isdigit() for c in t):
            return t
        end = m.end()
        nxt = s[end:end + 1]
        if t == "gamma" and nxt == "(":
            return "_gamma"
        if len(t) == 1:
            return t + ("*" if nxt == "(" else "")
        if t.isalpha() and len(t) <= 4 and all(c.isascii() for c in t):
            return "*".join(t) + ("*" if nxt == "(" else "")
        return t + ("*" if nxt == "(" else "")
    return ID.sub(rep, s)


def prep(text, known):
    gd = known if isinstance(known, dict) else None
    known = set(known)
    s = text.strip()
    for a, b in UNI.items():
        s = s.replace(a, b)
    s = re.sub(r"(?<=\d),(?=\d)", ".", s)
    s = re.sub(r"\bund\b", "and", s)
    s = re.sub(r"\boder\b", "or", s)
    s = _logic(s)
    s = _abs_bars(s)
    s = re.sub(r"([A-Za-z_]\w*)('+)\(", lambda m: f"_dp({m.group(1)},{len(m.group(2))},", s)
    s = s.replace("°", "" if CFG["angle"] == "deg" else "*pi/180")
    s = _brackets(s)
    s = re.sub(r"(?<![<>=!:])=(?!=)", "==", s)
    s = s.replace(";", ",")
    s = _ids(s, known)
    if gd is not None:
        for k, v in gd.items():
            if k.isidentifier() and not isinstance(v, (sp.Basic, type)) and not callable(v) and re.search(r"(?<![\w.])%s(?![\w(])" % re.escape(k), s):
                s = re.sub(r"(?<![\w.])%s(?![\w(])" % re.escape(k), '_V["%s"]' % k, s)
    return s


def _tree(tree):
    class T(ast.NodeTransformer):
        def visit_Compare(self, n):
            self.generic_visit(n)
            parts = []
            left = n.left
            for op, right in zip(n.ops, n.comparators):
                if isinstance(op, ast.Eq):
                    node = ast.Call(ast.Name("Eq", ast.Load()), [left, right], [])
                elif isinstance(op, ast.NotEq):
                    node = ast.Call(ast.Name("Ne", ast.Load()), [left, right], [])
                else:
                    node = ast.Compare(left, [op], [right])
                parts.append(node)
                left = right
            return parts[0] if len(parts) == 1 else ast.Call(ast.Name("And", ast.Load()), parts, [])

        def visit_BoolOp(self, n):
            self.generic_visit(n)
            return ast.Call(ast.Name("And" if isinstance(n.op, ast.And) else "Or", ast.Load()), n.values, [])
    return ast.fix_missing_locations(T().visit(tree))


def _dp(f, n, arg):
    X = Symbol("x")
    d = sp.diff(f(X) if callable(f) else f, X, n)
    return sp.simplify(d.subs(X, arg))


class Env(dict):
    def __call__(self, *a):
        raise TypeError("kein Funktionsaufruf")


def _glob(ns):
    g = Env(BASE)
    g["_dp"] = _dp
    g.update(ns)
    return g


def _eval(text, ns):
    g = _glob(ns)
    g['_V'] = g
    code = prep(text, g)
    py = stringify_expr(code, {}, g, TRANS)
    tree = _tree(ast.parse(py, mode="eval"))
    return eval(compile(tree, "<in>", "eval"), g)


# ---------------------------------------------------------------- Ausgabe
def _latex(o):
    kw = dict(decimal_separator="comma", inv_trig_style="full", ln_notation=True, full_prec=False, mat_delim="(", mat_str="array")
    try:
        return sp.latex(o, **kw)
    except TypeError:
        try:
            return sp.latex(o, decimal_separator="comma", full_prec=False)
        except Exception:
            return sp.latex(o)


def tex(o):
    if isinstance(o, Loesung):
        return _set_tex(o.var, o.menge, _latex)
    if isinstance(o, Report):
        return o.tex()
    if o is sp.zoo or o is sp.nan:
        return r"\text{undefiniert}"
    if isinstance(o, bool) or o is sp.true or o is sp.false:
        return r"\text{wahr}" if bool(o) else r"\text{falsch}"
    if _isl(o):
        return r"\left\{" + ",\\ ".join(tex(a) for a in o) + r"\right\}"
    if isinstance(o, dict):
        return r"\left\{" + ",\\ ".join(f"{tex(k)}:{tex(v)}" for k, v in o.items()) + r"\right\}"
    if isinstance(o, str):
        return r"\text{" + o + "}"
    if isinstance(o, sp.Basic) or isinstance(o, sp.MatrixBase):
        return _latex(o)
    return _latex(sp.sympify(o))


def _approx(o):
    try:
        if isinstance(o, sp.Basic) and not isinstance(o, (sp.Float, sp.Integer, sp.logic.boolalg.Boolean)) and isinstance(o, sp.Expr) \
                and not o.free_symbols and not o.has(sp.Function) and o.is_number:
            v = sp.N(o, CFG["digits"])
            re_, im_ = sp.re(v), sp.im(v)
            if abs(re_ - round(float(re_))) < 1e-12 and abs(im_ - round(float(im_))) < 1e-12:
                return None
            return _latex(v)
        if isinstance(o, sp.MatrixBase) and not o.free_symbols and any(not e.is_Integer and not e.is_Float for e in o):
            return _latex(o.applyfunc(lambda e: sp.N(e, CFG["digits"])))
    except Exception:
        return None
    return None


def txt(o):
    try:
        if isinstance(o, Loesung):
            return str(o.menge)
        if isinstance(o, Report):
            return "; ".join(f"{a}: {b}" for a, b in o.rows)
        return str(o)
    except Exception:
        return ""

_DEF = re.compile(r"^\s*([A-Za-z_Ͱ-Ͽ][\wͰ-Ͽ.]*)\s*(?:\(([^()]*)\))?\s*:=\s*(.+)$", re.S)


def _typ(v):
    if isinstance(v, sp.Lambda):
        return "Funktion"
    if isinstance(v, sp.MatrixBase):
        return "Matrix" if v.cols > 1 else "Vektor"
    if _isl(v):
        return "Liste"
    if isinstance(v, sp.Basic) and v.is_number:
        return "Zahl"
    if isinstance(v, (str,)):
        return "Text"
    return "Ausdruck"


def run(pid, text, quiet=False):
    """Wertet eine Eingabezeile im Problem pid aus. Liefert JSON."""
    global CUR
    P = problem(pid)
    CUR = P
    ns = P["ns"]
    out = {"ok": True, "assigned": []}
    try:
        s = text.strip()
        if not s:
            return json.dumps({"ok": True, "empty": True})
        store_name = None
        m = _DEF.match(s)
        fname = fargs = None
        if m:
            fname, fargs, body = _lower_name(m.group(1)), m.group(2), m.group(3)
            if fargs:
                fargs = fargs.replace("θ", "theta")
                fargs = ",".join(_lower_name(a.strip()) for a in re.split(r"[;,]", fargs))
            s_eval = body
        elif "→" in s or "->" in s:
            parts = re.split(r"→|->", s)
            s_eval, store_name = parts[0], _lower_name(parts[-1].strip())
        else:
            s_eval = s
        s_eval, conds = _split_with(s_eval)
        # Anzeige der Eingabe (unausgewertet)
        out["in_tex"] = _echo(s_eval, ns, fname, fargs, None if conds else store_name)
        if conds:
            ctx = [_echo(cd, ns, None, None, None) for cd in conds]
            out["in_tex"] = out["in_tex"] + r"\,\Big|\,\," + r"\text{ und }".join(ctx) + (r"\to " + store_name if store_name else "")
        auto_solve = not fname and not store_name and _top_rel(s_eval)
        # dsolve-Sonderfall
        if re.match(r"\s*(dsolve|desolve)\s*\(", s_eval, re.I):
            res = _dsolve_text(_to_dsolve(s_eval), ns)
        else:
            res = _eval(s_eval, ns)
        if conds:
            res = _apply_with(res, conds, ns)
        if auto_solve and isinstance(res, sp.core.relational.Relational) and res.free_symbols and not res.atoms(sp.core.function.AppliedUndef):
            res = f_solve(res)
        if fname and fargs is not None:
            args = [Symbol(a.strip()) for a in re.split(r"[;,]", fargs) if a.strip()]
            sym = res if isinstance(res, sp.Basic) else sp.sympify(res)
            val = Lambda(tuple(args), sym)
            ns[fname] = val
            P["src"][fname] = f"{fname}({fargs}) := {body}"
            out["assigned"].append(fname)
            out["out_tex"] = r"\text{Fertig}"
            out["define"] = True
            return json.dumps(out)
        if fname:
            ns[fname] = res
            P["src"][fname] = f"{fname} := {body}"
            out["assigned"].append(fname)
            res = res
        if store_name:
            ns[store_name] = res
            P["src"][store_name] = f"{store_name} := {s_eval}"
            out["assigned"].append(store_name)
        if CFG["mode"] == "approx" and isinstance(res, (sp.Basic, sp.MatrixBase)) and not isinstance(res, Loesung):
            try:
                res = res.evalf(CFG["digits"])
            except Exception:
                pass
        out["out_tex"] = tex(res)
        out["out_txt"] = txt(res)
        if CFG["mode"] == "both":
            a = _approx(res)
            if a and a != out["out_tex"]:
                out["approx"] = a
        if isinstance(res, Report) and res.expr is not None:
            ns["ans"] = res.expr
        else:
            ns["ans"] = res
        P["ans"] = res
    except Exception as ex:
        out = {"ok": False, "error": _fehler(ex)}
    return json.dumps(out)



_COND = re.compile(r"^\s*([A-Za-z_\u0370-\u03ff][\w\u0370-\u03ff]*)\s*(<=|>=|!=|=|<|>)\s*(.+)$", re.S)


def _top_rel(s):
    depth = 0
    for i, ch in enumerate(s):
        if ch in "([{":
            depth += 1
        elif ch in ")]}":
            depth -= 1
        elif depth == 0 and ch in "=<>" and s[i - 1:i] not in (":", "-") and s[i:i + 2] != "->":
            return True
    return "!=" in s and depth == 0


def _split_with(s):
    """Trennt den mit-Operator ab: 'term | x = 3 and y > 0'. Betragsstriche stehen paarweise, ein unpaariger letzter Strich ist der mit-Operator."""
    for a, b in {"≤": "<=", "≥": ">=", "≠": "!=", "∧": " and "}.items():
        s = s.replace(a, b)
    depth, bars = 0, []
    for i, ch in enumerate(s):
        if ch in "([{":
            depth += 1
        elif ch in ")]}":
            depth -= 1
        elif ch == "|" and depth == 0:
            bars.append(i)
    if len(bars) % 2 == 0:
        return s, []
    i = bars[-1]
    cond = s[i + 1:]
    parts = [p for p in re.split(r"\s+(?:and|und)\s+", cond.strip()) if p.strip()]
    return s[:i], parts


def _apply_with(res, conds, ns):
    subs, cons = {}, []
    for c in conds:
        m = _COND.match(c)
        if not m:
            raise Fehler("Nach | muss eine Bedingung wie x = 3 oder x > 0 stehen")
        var, op, rhs = m.groups()
        val = _eval(rhs, ns)
        (subs.__setitem__(Symbol(var), val) if op == "=" else cons.append((Symbol(var), op, val)))
    if isinstance(res, Loesung):
        mg = res.menge
        for v, op, val in cons:
            rel = {"<": v < val, ">": v > val, "<=": v <= val, ">=": v >= val, "!=": sp.Ne(v, val)}[op]
            mg = mg.intersect(sp.solveset(rel, v, S.Reals))
        for v, val in subs.items():
            mg = mg.intersect(FiniteSet(val))
        return Loesung(res.var, mg)
    if cons:
        raise Fehler("Ungleichungen nach | sind nur bei solve möglich")
    if isinstance(res, Report):
        raise Fehler("Der mit-Operator lässt sich hier nicht anwenden")

    def sub(r):
        if _isl(r):
            return [sub(a) for a in r]
        r = sp.sympify(r) if not isinstance(r, sp.MatrixBase) else r
        r = r.subs(subs)
        try:
            r = r.doit()
        except Exception:
            pass
        return r
    return sub(res)



def _fehler(ex):
    n = type(ex).__name__
    m = str(ex)
    if isinstance(ex, SyntaxError):
        return "Syntaxfehler: Eingabe unvollständig oder ungültig"
    if isinstance(ex, ZeroDivisionError):
        return "Division durch null"
    if isinstance(ex, NotImplementedError):
        return "Dafür gibt es keine Lösungsmethode (" + m[:90] + ")"
    if "No module named" in m or "scipy" in m.lower():
        return "SciPy ist noch nicht geladen. Bitte kurz warten und noch einmal berechnen."
    if isinstance(ex, TypeError) and "argument" in m:
        return "Falsche Anzahl oder Art der Argumente (" + m[:80] + ")"
    if isinstance(ex, (ValueError, TypeError, AttributeError, KeyError, IndexError)):
        return f"{n}: {m[:140]}"
    return f"{n}: {m[:140]}"


class CallNode(sp.Expr):
    """Unausgewerteter Aufruf fuer die Eingabe-Anzeige."""
    is_commutative = True

    def __new__(cls, name, *args):
        obj = sp.Expr.__new__(cls, *[sp.sympify(a) if not isinstance(a, (list, tuple)) else ListNode(*a) for a in args])
        obj.fname = name
        return obj

    def _latex(self, p):
        n = self.fname.replace("stat_", "stat.").replace("_", r"\_")
        return r"\mathrm{%s}\left(%s\right)" % (n, ",\\ ".join(p._print(a) for a in self.args))


class ListNode(sp.Expr):
    is_commutative = True

    def __new__(cls, *args):
        return sp.Expr.__new__(cls, *[sp.sympify(a) for a in args])

    def _latex(self, p):
        return r"\left\{%s\right\}" % ",\\ ".join(p._print(a) for a in self.args)


def _mkcall(nm):
    def w(*a):
        return CallNode(nm, *a)
    w.name = nm
    return w


def _echo(s_eval, ns, fname, fargs, store_name):
    """LaTeX der Eingabe, soweit moeglich unausgewertet."""
    try:
        if re.match(r"\s*(dsolve|desolve)", s_eval, re.I):
            raise ValueError
        g = _glob(ns)
        g['_V'] = g
        code = prep(s_eval, g)
        py = stringify_expr(code, {}, g, TRANS)
        tree = _tree(ast.parse(py, mode="eval"))
        keep = {"sin": sp.sin, "cos": sp.cos, "tan": sp.tan, "asin": sp.asin, "acos": sp.acos, "atan": sp.atan, "sinh": sp.sinh,
                "cosh": sp.cosh, "tanh": sp.tanh, "exp": sp.exp, "sqrt": sp.sqrt, "ln": sp.log, "Abs": Abs, "abs": Abs, "Eq": Eq, "Ne": Ne,
                "And": And, "Or": Or, "Piecewise": Piecewise, "Matrix": Matrix, "Symbol": Symbol, "Integer": Integer, "Float": Float,
                "Rational": Rational, "factorial": sp.factorial, "binomial": sp.binomial, "re": sp.re, "im": sp.im, "conjugate": sp.conjugate,
                "arg": sp.arg, "sign": sp.sign, "floor": sp.floor, "ceiling": sp.ceiling, "gamma": sp.gamma, "erf": sp.erf}
        h = dict(g)
        for k, v in g.items():
            if k in keep:
                h[k] = keep[k]
            elif isinstance(v, sp.Lambda) or (callable(v) and k in BASE and not isinstance(v, type) and k not in ("_M", "_L", "_dp", "_M2")):
                h[k] = _mkcall(k)
        h["_L"] = lambda items: ListNode(*items)
        h["_dp"] = lambda f, n, arg: CallNode("", arg) if False else Function(getattr(f, "name", getattr(f, "__name__", "f")) + "'" * n)(arg) if hasattr(f, "name") or hasattr(f, "__name__") else arg

        def _ev(fn):
            def w(*a):
                with sp.evaluate(True):
                    return fn(*a)
            return w
        h["diff"] = _ev(lambda e, *a: sp.Derivative(e, *(a if a else [_var(e)])))
        h["integrate"] = _ev(lambda e, x=None, a=None, b=None: sp.Integral(e, x if a is None else (x, a, b)))
        h["limit"] = _ev(lambda e, x, a, d=None: sp.Limit(e, x, a, d if d else "+-"))
        h["summation"] = h["sum"] = _ev(lambda e, *a: sp.Sum(e, tuple(a)) if len(a) == 3 else CallNode("sum", e))
        h["product"] = h["prod"] = _ev(lambda e, *a: sp.Product(e, tuple(a)) if len(a) == 3 else CallNode("prod", e))
        h["root"] = lambda x, n=2: sp.Pow(x, sp.Integer(1) / n) if False else CallNode("root", x, n)
        h["d"] = _ev(lambda e=None, x=None, n=1: sp.Derivative(e, x, int(n)) if x is not None else Symbol("d") * e)
        h["ti_int"] = _ev(lambda e, x, a=None, b=None: sp.Integral(e, x if a is None else (x, a, b)))
        h["ti_sum"] = _ev(lambda e, x, lo, hi: sp.Sum(e, (x, lo, hi)))
        h["ti_prod"] = _ev(lambda e, x, lo, hi: sp.Product(e, (x, lo, hi)))
        h["limit"] = _ev(lambda e, x, a, d=None: sp.Limit(e, x, a, {1: "+", -1: "-"}.get(d, "+-") if d is not None else "+-"))
        with sp.evaluate(False):
            o = eval(compile(tree, "<in>", "eval"), h)
        t = tex(o)
        if fname:
            t = (f"{fname}({fargs})" if fargs is not None else fname) + ":=" + t
        if store_name:
            t = t + r"\to " + store_name
        return t
    except Exception:
        t = s_eval.replace("\\", " ")
        pre = ""
        if fname:
            pre = (f"{fname}({fargs})" if fargs is not None else fname) + " := "
        return r"\texttt{" + (pre + t).replace("_", r"\_").replace("#", r"\#").replace("%", r"\%").replace("&", r"\&").replace("{", r"\{").replace("}", r"\}") + "}"


def _mkfn(name):

def _dsolve_text(s, ns):
    inner = s.strip()[s.strip().index("(") + 1:-1]
    parts = _split_args(inner)
    yname = parts[1].strip() if len(parts) > 1 else "y"
    x = Symbol("x")
    yf = Function(yname)
    eqs = parts[0].strip()
    for n in (3, 2, 1):
        eqs = re.sub(rf"\b{yname}'{{{n}}}", f"Derivative({yname}(x), x, {n})", eqs)
    eqs = re.sub(rf"\b{yname}'", f"Derivative({yname}(x), x)", eqs)
    g = _glob(ns)
    g[yname] = yf
    g["Derivative"] = sp.Derivative
    g["_V"] = g
    code = prep(eqs, g)
    # y als Funktion von x ausdruecken: y -> y(x)
    code = re.sub(rf"\b{yname}\b(?!\()", f"{yname}(x)", code)
    code = code.replace(f"Derivative({yname}(x)(x)", f"Derivative({yname}(x)")
    py = stringify_expr(code, {}, g, TRANS)
    eq = eval(compile(_tree(ast.parse(py, mode="eval")), "<in>", "eval"), g)
    if not isinstance(eq, Eq):
        eq = Eq(eq, 0)
    ics = None
    if len(parts) > 2:
        ics = {}
        for p in parts[2:]:
            m = re.match(r"\s*" + yname + r"\s*\(([^)]*)\)\s*=\s*(.+)", p.replace("==", "="))
            if m:
                ics[yf(_eval(m.group(1), ns))] = _eval(m.group(2), ns)
    return sp.dsolve(eq, yf(x), ics=ics) if ics else sp.dsolve(eq, yf(x))

def _lam(pid, text_or_name):
    text_or_name = _lower_name(text_or_name) if re.match(r"^[A-Za-z_][\w]*$", text_or_name) else text_or_name
    P = problem(pid)
    ns = P["ns"]
    x = Symbol("x")
    if text_or_name in ns and isinstance(ns[text_or_name], sp.Lambda):
        f = ns[text_or_name]
        e = f(*f.variables) if len(f.variables) == 1 else f.expr
        return sp.lambdify(f.variables[0], e, "numpy"), e, f.variables[0]
    e = _eval(text_or_name, ns)
    xs = x if x in sp.sympify(e).free_symbols or not sp.sympify(e).free_symbols else _var(e)
    return sp.lambdify(xs, e, "numpy"), e, xs


def sample(pid, name, a, b, n):
    import numpy as np
    fn, e, v = _lam(pid, name)
    X = np.linspace(a, b, int(n))
    with np.errstate(all="ignore"):
        Y = fn(X)
    Y = np.asarray(Y, dtype=complex) if np.iscomplexobj(Y) else np.asarray(Y, dtype=float)
    if np.iscomplexobj(Y):
        Y = np.where(np.abs(Y.imag) < 1e-12, Y.real, np.nan)
    Y = np.broadcast_to(Y, X.shape).astype(float)
    Y[~np.isfinite(Y)] = np.nan
    return json.dumps([None if np.isnan(v) else round(float(v), 9) for v in Y])


def sample_param(pid, xn, yn, a, b, n):
    import numpy as np
    fx, _, _ = _lam(pid, xn)
    fy, _, _ = _lam(pid, yn)
    T = np.linspace(a, b, int(n))
    with np.errstate(all="ignore"):
        X = np.broadcast_to(np.asarray(fx(T), dtype=float), T.shape)
        Y = np.broadcast_to(np.asarray(fy(T), dtype=float), T.shape)
    cl = lambda A: [None if not math.isfinite(v) else round(float(v), 9) for v in A]
    return json.dumps([cl(X), cl(Y)])


def sample_polar(pid, rn, a, b, n):
    import numpy as np
    fr, _, _ = _lam(pid, rn)
    T = np.linspace(a, b, int(n))
    with np.errstate(all="ignore"):
        R = np.broadcast_to(np.asarray(fr(T), dtype=float), T.shape)
    X, Y = R * np.cos(T), R * np.sin(T)
    cl = lambda A: [None if not math.isfinite(v) else round(float(v), 9) for v in A]
    return json.dumps([cl(X), cl(Y)])


def _roots_num(fn, a, b, n=4000):
    import numpy as np
    X = np.linspace(a, b, n)
    with np.errstate(all="ignore"):
        Y = np.asarray(fn(X), dtype=float)
    out = []
    for i in range(n - 1):
        y0, y1 = Y[i], Y[i + 1]
        if not (math.isfinite(y0) and math.isfinite(y1)):
            continue
        if y0 == 0:
            out.append(float(X[i]))
        elif y0 * y1 < 0:
            lo, hi = X[i], X[i + 1]
            for _ in range(60):
                mid = (lo + hi) / 2
                with np.errstate(all="ignore"):
                    ym = float(fn(mid))
                if ym * float(fn(lo)) <= 0:
                    hi = mid
                else:
                    lo = mid
            r = (lo + hi) / 2
            with np.errstate(all="ignore"):
                if abs(float(fn(r))) < 1e-5 * (1 + abs(Y[i])):
                    out.append(float(r))
    ded = []
    for r in out:
        if not ded or abs(r - ded[-1]) > 1e-7:
            ded.append(r)
    return ded


def _exact(v, y=None):
    try:
        r = sp.nsimplify(v, rational=True, tolerance=1e-10)
        if r.is_Rational and abs(r.q) <= 1000 and abs(float(r) - v) < 1e-9:
            return r
    except Exception:
        pass
    return None


def _pt(x, y):
    ex, ey = _exact(x), _exact(y)
    return {"x": float(x), "y": float(y), "tx": tex(ex) if ex is not None else tex(Float(x, 6)), "ty": tex(ey) if ey is not None else tex(Float(y, 6)),
            "ex": ex is not None}


def analyze(pid, kind, name, a, b, name2=None):
    """kind: null, min, max, wende, schnitt, yachse. Liefert Punkte im Intervall [a, b]."""
    fn, e, v = _lam(pid, name)
    pts = []
    if kind == "null":
        for r in _roots_num(fn, a, b):
            pts.append(_pt(r, 0.0))
    elif kind in ("min", "max", "extrem"):
        d = sp.lambdify(v, sp.diff(e, v), "numpy")
        d2 = sp.lambdify(v, sp.diff(e, v, 2), "numpy")
        for r in _roots_num(d, a, b):
            s = float(d2(r))
            if (kind == "min" and s > 0) or (kind == "max" and s < 0) or kind == "extrem":
                p = _pt(r, float(fn(r)))
                p["art"] = "Tiefpunkt" if s > 0 else ("Hochpunkt" if s < 0 else "Sattelpunkt")
                pts.append(p)
    elif kind == "wende":
        d2 = sp.lambdify(v, sp.diff(e, v, 2), "numpy")
        d3 = sp.lambdify(v, sp.diff(e, v, 3), "numpy")
        for r in _roots_num(d2, a, b):
            if abs(float(d3(r))) > 1e-9:
                pts.append(_pt(r, float(fn(r))))
    elif kind == "schnitt" and name2:
        fn2, e2, v2 = _lam(pid, name2)
        diff = lambda X: fn(X) - fn2(X)
        for r in _roots_num(diff, a, b):
            pts.append(_pt(r, float(fn(r))))
    elif kind == "yachse":
        pts.append(_pt(0.0, float(fn(0.0))))
    return json.dumps(pts)

def fe_berechne(pid, zeilen_json, index):
    """Wertet eine Zeile des Formelblatts mit dem Original-Rechenkern aus. Definitionen des Problems stehen davor."""
    from formeleditor.rechnen import Arbeitsblatt, RechenFehler
    from formeleditor.sprache import SprachFehler
    zeilen, index = json.loads(zeilen_json), int(index)
    blatt = Arbeitsblatt()
    for src in list(problem(pid)["src"].values()):
        try:
            blatt.berechne(src)
        except Exception:
            pass
    for z in zeilen[:index]:
        if ":=" in z:
            try:
                blatt.berechne(z)
            except Exception:
                pass
    try:
        res = blatt.berechne(zeilen[index])
    except SprachFehler as e:
        res = {"fehler": str(e), "pos": e.pos}
    except RechenFehler as e:
        res = {"fehler": str(e)}
    except NotImplementedError as e:
        res = {"fehler": "Das kann SymPy nicht lösen" + (f": {e}" if str(e) else "")}
    except Exception as e:
        res = {"fehler": f"Nicht berechenbar ({type(e).__name__}: {e})"}

    return x, None


def t_nsolve(eq, x, *rest):
    v, g = _var_guess(x)
    if isinstance(eq, Eq):
        eq = eq.lhs - eq.rhs
    if g is not None:
        return Eq(v, sp.nsolve(eq, v, g))
    for g0 in (1, 0, -1, 2, -2, 5, -5, 10, 0.5):
        try:
            return Eq(v, sp.nsolve(eq, v, g0))
        except Exception:
            continue
    raise Fehler("Keine Näherungslösung gefunden")


def t_fmin(e, x=None):
    x = _var(e, x)
    pts = [v for v in _crit(e, x, 1) if sp.diff(e, x, 2).subs(x, v).is_positive]
    if not pts:
        return S.NaN
    best = min(pts, key=lambda v: float(sp.N(e.subs(x, v))))
    return Eq(x, best)


def t_fmax(e, x=None):
    x = _var(e, x)
    pts = [v for v in _crit(e, x, 1) if sp.diff(e, x, 2).subs(x, v).is_negative]
    if not pts:
        return S.NaN
    best = max(pts, key=lambda v: float(sp.N(e.subs(x, v))))
    return Eq(x, best)


def t_arclen(e, x, a, b):
    f = sp.sqrt(1 + sp.diff(e, x) ** 2)
    try:
        r = sp.integrate(f, (x, a, b))
        if r.has(sp.Integral):
            raise ValueError
        return r
    except Exception:

def t_impdif(eq, x, y, n=1):
    if isinstance(eq, Eq):

    return sp.idiff(eq, y, x, int(n))


def t_nderiv(e, x, h=None):
    v, g = _var_guess(x)
    h = sp.Rational(1, 1000) if h is None else h
    if g is None:
        raise Fehler("nDeriv(Ausdruck, x=Stelle)")
    return sp.N((e.subs(v, g + h) - e.subs(v, g - h)) / (2 * h), CFG["digits"])

def t_avgrc(e, x, h=None):
    v, g = _var_guess(x)
    h = h if h is not None else sp.Rational(1, 1000)
    return sp.simplify((e.subs(v, g + h) - e.subs(v, g)) / h) if g is not None else (e.subs(v, v + h) - e) / h


def t_zeros(e, x=None):
    x = _var(e, x)
    m = sp.solveset(e, x, S.Reals)
    if isinstance(m, FiniteSet):
        return _tl(sorted(list(m), key=lambda v: float(sp.N(v))))
    return Loesung(x, _clean(m))


def t_czeros(e, x=None):

    if isinstance(m, FiniteSet):
        return _tl(sorted(list(m), key=lambda v: (float(sp.re(sp.N(v))), float(sp.im(sp.N(v))))))
    return Loesung(x, _clean(m))


def t_factor(e, x=None):
    if isinstance(e, sp.Integer) and abs(e) > 1:
        f = sp.factorint(abs(int(e)))
        parts = [sp.Pow(sp.Integer(p), sp.Integer(k), evaluate=False) if k > 1 else sp.Integer(p) for p, k in sorted(f.items())]
        if e < 0:
            parts.insert(0, sp.Integer(-1))
        return parts[0] if len(parts) == 1 else sp.Mul(*parts, evaluate=False)
    return sp.factor(e)


def t_expand(e, x=None):

def t_comdenom(e, x=None):
    return sp.together(e)


def t_propfrac(e, x=None):
    e = sp.sympify(e)
    if e.is_Rational and not e.is_Integer:
        q = sp.Integer(int(sp.sign(e) * sp.floor(abs(e))))
        return sp.Add(q, e - q, evaluate=False)
    return sp.apart(e, x) if x is not None else sp.apart(e)


def t_approx(e):

def t_getdenom(e):

def t_polyroots(p, x=None):

    r = sp.roots(sp.Poly(p, x), filter="R") if False else sp.roots(sp.Poly(p, x))
    out = []
    for k, v in r.items():
        if k.is_real is not False:
            out += [k] * int(v)
    return _tl(sorted(out, key=lambda v: float(sp.N(v))))


def t_cpolyroots(p, x=None):
    x = _var(p, x)
    r = sp.roots(sp.Poly(p, x))
    out = []
    for k, v in r.items():
        out += [k] * int(v)
    return _tl(sorted(out, key=lambda v: (float(sp.re(sp.N(v))), float(sp.im(sp.N(v))))))


def t_remain(a, b):
    return a - b * t_ipart(a / b)


def t_ipart(x):
    if isinstance(x, (list, tuple)):
        return SList(t_ipart(a) for a in x)
    x = sp.sympify(x)
    return sp.Integer(int(sp.sign(x) * sp.floor(abs(x)))) if x.is_number else x


def t_fpart(x):
    if isinstance(x, (list, tuple)):
        return SList(t_fpart(a) for a in x)
    return sp.simplify(x - t_ipart(x))


def t_randsamp(lst, k=1, norepl=0):
    lst = list(lst)
    if norepl:
        return SList(random.sample(lst, int(k)))
    return SList(random.choice(lst) for _ in range(int(k)))


def t_variance(xs, freq=None):

def t_mean(xs, freq=None):
    v = _vals(xs)
    if freq is None:
        return sp.simplify(sp.Add(*v) / len(v))
    w = _vals(freq)
    return sp.simplify(sp.Add(*[a * b for a, b in zip(v, w)]) / sp.Add(*w))


def t_median(xs, freq=None):
    v = _vals(xs)
    if freq is not None:
        v = [a for a, n in zip(v, _vals(freq)) for _ in range(int(n))]
    return f_median(v)


def t_sum_list(xs, a=None, b=None):

def t_prod_list(xs, a=None, b=None):

def t_right(xs, n=1):

def t_binomcdf(n, p, a=None, b=None):

def t_geomcdf(p, a, b=None):

    if b is None:

def t_eigvl(M):
    ev = M.eigenvals()
    out = []
    for k, v in ev.items():

    return _tl(sorted(out, key=lambda z: (float(sp.re(sp.N(z))), float(sp.im(sp.N(z))))))


def t_eigvc(M):
    cols = []
    for ev, mult, vecs in sorted(M.eigenvects(), key=lambda t: float(sp.re(sp.N(t[0])))):
        for v in vecs:
            cols.append(sp.simplify(v / v.norm()))
    return Matrix.hstack(*cols) if cols else Matrix([])


def t_ref(M):
    E = M.echelon_form()
    rows = []
    for i in range(E.rows):
        r = E.row(i)
        piv = next((x for x in r if x != 0), None)
        rows.append(r / piv if piv is not None else r)
    return Matrix.vstack(*rows)


def t_submat(M, r0=1, c0=1, r1=None, c1=None):

def t_rowadd(M, i, j):

def t_rowswap(M, i, j):

def t_mrow(k, M, i):

def t_mrowadd(k, M, i, j):

def _tvm_eq(n, i, pv, pmt, fv, ppy, at):
    r = i / 100 / ppy
    t = 1 if at else 0
    return pv + (1 + r * t) * pmt * (1 - (1 + r) ** (-n)) / r + fv * (1 + r) ** (-n)


def t_tvmfv(n, i, pv, pmt, ppy=1, cpy=1, at=0):

    return sp.simplify(sp.solve(_tvm_eq(n, sp.sympify(i), pv, pmt, f, ppy, at), f)[0]).evalf(CFG["digits"])


def t_tvmpv(n, i, pmt, fv, ppy=1, cpy=1, at=0):

def t_tvmn(i, pv, pmt, fv, ppy=1, cpy=1, at=0):
    f = Symbol("_n", positive=True)
    r = _tvm_eq(f, sp.sympify(i), pv, pmt, fv, ppy, at)

    keys = ["xbar", "sumx", "sumx2", "sx", "sigx", "n", "minx", "q1x", "medianx", "q3x", "maxx"]
    for (lab, val), k in zip(rows, keys):

def _bracket_ti(s):
    """TI: [1,2;3,4] Zeilen mit ; Spalten mit , – [1;2;3] Spaltenvektor – {a,b,c} Liste."""
    out, i = [], 0
    while i < len(s):
        ch = s[i]
        if ch == "[":
            d, j = 0, i
            while j < len(s):
                if s[j] in "([{":
                    d += 1
                elif s[j] in ")]}":
                    d -= 1
                    if d == 0:
                        break
                j += 1
            inner = s[i + 1:j]
            if "[" in inner:
                out.append("_M(" + _bracket_ti("[" + inner + "]").replace("_M(", "", 1)[:-1] + ")" if False else "_M([" + _bracket_ti(inner) + "])")
            else:
                rows = [r for r in _split_top(inner, ";")]
                out.append("_M2([" + ",".join("[" + ",".join(_bracket_ti(c) for c in _split_top(r, ",")) + "]" for r in rows) + "])")
            i = j + 1
        elif ch == "{":
            d, j = 0, i
            while j < len(s):
                if s[j] in "([{":
                    d += 1
                elif s[j] in ")]}":
                    d -= 1
                    if d == 0:
                        break
                j += 1
            inner = s[i + 1:j]
            out.append("_L([" + ",".join(_bracket_ti(c) for c in _split_top(inner, ",") if c.strip() != "") + "])")
            i = j + 1
        else:
            out.append(ch)
            i += 1
    return "".join(out)


def _split_top(s, sep):
    parts, d, cur = [], 0, ""
    for ch in s:
        if ch in "([{":
            d += 1
        elif ch in ")]}":
            d -= 1
        if ch == sep and d == 0:
            parts.append(cur)
            cur = ""
        else:
            cur += ch
    parts.append(cur)
    return parts


def _M2(rows):
    if all(len(r) == 1 for r in rows):
        return Matrix([r[0] for r in rows])
    return Matrix(rows)

    def rep(m):
        t = m.group(0)
        nxt = s[m.end():m.end() + 1]
        if m.start() > 0 and s[m.start() - 1] == "." and not s[m.start() - 2:m.start() - 1].isdigit():
            return t
        if t == "gamma" and nxt == "(":
            return "_gamma"
        if t == "d" and nxt != "(":
            return "_dsym"
        if t in ("and", "or", "not", "True", "False", "xor"):
            return t
        if t in known and not (t == "N" and nxt != "("):
            return t
        if t in GREEK:
            return t
        tl = t.lower()
        if tl in TI_CANON and TI_CANON[tl] in known:
            return TI_CANON[tl]
        if t not in known and tl in known and len(tl) > 2:
            return tl
        if t.startswith("_") or "_" in t:
            return t
        if tl in known or tl in GREEK:
            return tl
        # Variablennamen sind unabhängig von Groß- und Kleinschreibung
        if any(c.isdigit() for c in t):
            return tl + ("*" if nxt == "(" else "")
        if len(t) == 1:
            return tl + ("*" if nxt == "(" else "")
        if t.isalpha() and len(t) <= 3 and all(c.isascii() for c in t) and tl not in known:
            return "*".join(tl) + ("*" if nxt == "(" else "")
        return tl + ("*" if nxt == "(" else "")
    return ID.sub(rep, s)


def _fact_conv(s):
    """n! -> factorial(n); Python 3.12 (Pyodide) kennt das Zeichen ! nicht mehr."""
    while True:
        k = -1
        for i, ch in enumerate(s):
            if ch == "!" and s[i + 1:i + 2] != "=":
                k = i
                break
        if k < 0:
            return s
        j = k
        if j > 0 and s[j - 1] == ")":
            d, p = 0, j - 1
            while p >= 0:
                if s[p] == ")":
                    d += 1
                elif s[p] == "(":
                    d -= 1
                    if d == 0:
                        break
                p -= 1
            start = max(p, 0)
        else:
            m = re.search(r"[A-Za-z_0-9.]+$", s[:j])
            start = m.start() if m else j
        s = s[:start] + "factorial(" + s[start:j] + ")" + s[k + 1:]


def prep(text, known):
    gd = known if isinstance(known, dict) else None
    known = set(known)
    ti = CFG.get("syntax", "ti") == "ti"
    s = text.strip()
    s = s.replace("χ²", "chi2").replace("Δlist", "deltaList").replace("ΔList", "deltaList")
    s = _SUP_INV.sub(lambda m: "a" + m.group(1).lower(), s)
    s = _STATDOT.sub(_statname, s)
    s = _fact_conv(s)
    s = s.replace("Σ(", "ti_sum(").replace("Π(", "ti_prod(").replace("∫(", "ti_int(")
    for a, b in {**UNI, **TI_UNI}.items():
        s = s.replace(a, b)
    if not ti:
        s = re.sub(r"(?<=\d),(?=\d)", ".", s)
    s = re.sub(r"\bund\b", "and", s)
    s = re.sub(r"\boder\b", "or", s)
    s = _logic_ti(s) if ti else _logic(s)
    s = _abs_bars(s)
    s = re.sub(r"([A-Za-z_]\w*)('+)\(", lambda m: f"_dp({m.group(1)},{len(m.group(2))},", s)
    s = s.replace("°", "" if CFG["angle"] == "deg" else "*pi/180")
    s = _bracket_ti(s) if ti else _brackets(s)
    s = re.sub(r"(?<![<>=!:])=(?!=)", "==", s)
    s = s.replace(";", ",")
    s = _ids_ti(s, known)
    if gd is not None:
        for k, v in gd.items():
            if k.isidentifier() and not isinstance(v, (sp.Basic, type)) and not callable(v) and re.search(r"(?<![\w.])%s(?![\w(])" % re.escape(k), s):
                s = re.sub(r"(?<![\w.])%s(?![\w(])" % re.escape(k), '_V["%s"]' % k, s)
    return s


def _logic_ti(s):
    """wie _logic, aber Argumente werden durch Kommas getrennt"""
    if not re.search(r"\b(and|or)\b", s):
        return s
    out, i = "", 0
    while i < len(s):
        ch = s[i]
        if ch in _PAIR:
            d, j = 0, i
            while j < len(s):
                if s[j] in _PAIR:
                    d += 1
                elif s[j] in ")]}":
                    d -= 1
                    if d == 0:
                        break
                j += 1
            inner = s[i + 1:j] if j < len(s) else s[i + 1:]
            out += ch + _logic_ti(inner) + (s[j] if j < len(s) else "")
            i = j + 1
        else:
            out += ch
            i += 1
    return ",".join(_split_logic(a) for a in _split_top(out, ","))


def _latex(o):
    dec = "period" if CFG.get("syntax", "ti") == "ti" else "comma"
    kw = dict(decimal_separator=dec, inv_trig_style="full", ln_notation=True, full_prec=False, mat_delim="(", mat_str="array")
    try:
        return sp.latex(o, **kw)
    except TypeError:
        try:
            return sp.latex(o, decimal_separator=dec, full_prec=False)
        except Exception:
            return sp.latex(o)


_DEF = re.compile(r"^\s*([A-Za-z_Ͱ-Ͽ][\wͰ-Ͽ.]*)\s*(?:\(([^()]*)\))?\s*:=\s*(.+)$", re.S)
_DEFINE = re.compile(r"^\s*define\s+(.+)$", re.I | re.S)
_DELVAR = re.compile(r"^\s*delvar\s+(.+)$", re.I | re.S)


def _lower_name(n):
    return n.lower() if CFG.get("syntax", "ti") == "ti" else n


def _prep_stmt(s):
    """TI-Anweisungen: Define f(x)=…, DelVar a,b, LinRegMx x,y ..."""
    s = s.replace("χ²", "chi2")
    m = _DEFINE.match(s)
    if m:
        body = m.group(1)
        k = re.search(r"(?<![<>=!:])=(?!=)", body)
        if not k:
            raise Fehler("Define Name=Ausdruck")
        return body[:k.start()].strip() + " := " + body[k.end():].strip(), None
    m = _DELVAR.match(s)
    if m:
        return None, [a.strip() for a in re.split(r"[,;]", m.group(1)) if a.strip()]
    m = TI_CMD.match(s)
    if m:
        return TI_STAT[m.group(1).lower()] + "(" + m.group(2).strip() + ")", None
    return s, None

def _to_dsolve(s):
    """deSolve(Gleichung and Anfangswert, x, y) -> dsolve(Gleichung; y; Anfangswert)"""
    m = re.match(r"\s*(dsolve|desolve)\s*\((.*)\)\s*$", s, re.I | re.S)
    inner = m.group(2)
    if m.group(1).lower() == "dsolve":
        return s
    args = _split_top(inner, ",")
    if len(args) < 3:
        raise Fehler("deSolve(Gleichung, Variable, Funktion)")
    y = args[2].strip()
    parts = re.split(r"\s+(?:and|und)\s+", args[0])
    ode = [p for p in parts if not re.match(r"^\s*" + re.escape(y) + r"'*\s*\(", p)]
    ics = [p for p in parts if re.match(r"^\s*" + re.escape(y) + r"'*\s*\(", p)]
    return "dsolve(" + ode[0].strip() + "; " + y + "".join("; " + i.strip() for i in ics) + ")"
