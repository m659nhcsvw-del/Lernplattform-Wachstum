<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kapitel – Lernplattform Wachstum</title>
<link rel="stylesheet" href="shared/katex/katex.min.css">
<link rel="stylesheet" href="shared/style.css">
<script>try{var d=JSON.parse(localStorage.getItem("lip:design")||"null")||(matchMedia("(prefers-color-scheme: dark)").matches?"3b1b":"pearson");document.documentElement.setAttribute("data-design",d)}catch(e){}</script>
</head>
<body>
<main class="app" id="app"></main>
<script src="shared/katex/katex.min.js"></script>
<script src="shared/kern/kern.js"></script>
<script src="shared/plattform.js"></script>
<script>
  (function () {
    var k = (new URLSearchParams(location.search).get("k") || "1.1").replace(/[^0-9.]/g, "");
    var s = document.createElement("script");
    s.src = "inhalt/k" + k.replace(".", "-") + ".js";
    s.onload = function () {
      var uk = false; try { uk = JSON.parse(localStorage.getItem("lip:lang") || "null") === "uk"; } catch (e) {}
      if (!uk) { LIP.seiteKapitel(); return; }
      var u = document.createElement("script"); u.src = "inhalt/k" + k.replace(".", "-") + "-uk.js";
      u.onload = u.onerror = function () { LIP.seiteKapitel(); };   // fehlt die Übersetzung, bleibt es bei Deutsch
      document.body.appendChild(u);
    };
    s.onerror = function () { document.getElementById("app").innerHTML = "<p>Dieses Kapitel ist noch nicht verfügbar. <a href='index.html'>Zur Übersicht</a></p>"; LIP.fussZeile(); };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
